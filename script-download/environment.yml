name: mancing-scrape
channels:
  - conda-forge
dependencies:
  - python=3.12          # Playwright wheels lag new Python; 3.12 is the safe ceiling
  - ffmpeg               # yt-dlp needs it to mux separate video+audio streams
  - pillow               # thumbnail display in the interactive selector UI
  - pyyaml
  - pip
  - pip:
      - groq
      - playwright
      - playwright-stealth
      - yt-dlp
